<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class ="msg-container hide">
        <p id ="msg" data-testid="result-msg">Winner</p>
        <button id="new-round-btn" data-testid="new-round-btn">New Round</button>
    </div>
    <main>
        <h1>Tic Tac Toe</h1>
        <p id="turn-indicator" data-testid="turn-indicator">Player X's turn</p>
        <div class="scoreboard" data-testid="scoreboard">
            <span>O: <strong id="score-o">0</strong></span>
            <span>X: <strong id="score-x">0</strong></span>
            <span>Draws: <strong id="score-draw">0</strong></span>
        </div>
        <div class="container">
            <div class="game">
               <button class="cell" data-cell="0"></button>
               <button class="cell" data-cell="1"></button>
               <button class="cell" data-cell="2"></button>
               <button class="cell" data-cell="3"></button>
               <button class="cell" data-cell="4"></button>
               <button class="cell" data-cell="5"></button>
               <button class="cell" data-cell="6"></button>
               <button class="cell" data-cell="7"></button>
               <button class="cell" data-cell="8"></button>
            </div>
            <button class="reset" id="reset-btn" data-testid="reset-btn">Restart Game</button>
        </div>
    </main>
    <footer id="footer">
        <p id="footer-text">Made with ❤️ by Aarti <a href="https://github.com/aartipanchal">GitHub</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
